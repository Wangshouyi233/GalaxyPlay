name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private MFi assets
        shell: bash
        env:
          AUTH_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_PK8_BASE64 }}
          AUTH_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_P7B_BASE64 }}
        run: |
          set -euo pipefail
          auth_root="$(mktemp -d "$RUNNER_TEMP/galaxyplay-auth.XXXXXX")"
          chmod 700 "$auth_root"
          mkdir -p "$auth_root/offline-mfi"
          printf '%s' "$AUTH_IDENTITY_BASE64" | base64 --decode > "$auth_root/offline-mfi/identity.pk8"
          printf '%s' "$AUTH_CERTIFICATE_BASE64" | base64 --decode > "$auth_root/offline-mfi/certificate.p7b"
          chmod 600 "$auth_root/offline-mfi/"*
          echo "DIPLAY_AUTH_ASSETS_DIR=$auth_root" >> "$GITHUB_ENV"
      - name: Build with bundled MFi identity in Docker
        run: bash scripts/build-android-docker.sh --check
      - name: Upload credentialed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: galaxyplay-credentialed-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
